name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          missing=""
          for n in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions. See docs/guides/FIREBASE_LOGIN_SETUP.md"
            exit 1
          fi
      - name: Create site folder with Firebase settings
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          mkdir _site && cp -r docs/. _site/
          rm -rf _site/guides
          python3 - <<'PY'
          import json, os
          cfg = {"apiKey": os.environ["API_KEY"], "authDomain": os.environ["AUTH_DOMAIN"],
                 "projectId": os.environ["PROJECT_ID"], "appId": os.environ["APP_ID"],
                 "messagingSenderId": os.environ["SENDER_ID"]}
          open("_site/js/firebase-config.js", "w").write("window.KBIS_FIREBASE = " + json.dumps(cfg) + ";\n")
          PY
      - name: Block accidental private data
        run: |
          if find _site -name '*.xlsx' -o -path '_site/data/*' | grep -q .; then echo "::error::Private data found in site folder"; exit 1; fi
      - name: Check installable-app files
        run: python3 .github/scripts/check_pwa.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
