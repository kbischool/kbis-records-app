name: Pull request check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site folder (without secrets)
        run: |
          mkdir _site && cp -r docs/. _site/
          rm -rf _site/guides
      - name: Check installable-app files
        run: python3 .github/scripts/check_pwa.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
